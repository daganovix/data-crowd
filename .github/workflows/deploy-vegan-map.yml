name: Deploy Vegan Map to GitHub Pages

# Builds the standalone app in vegan-map/ and publishes it to GitHub Pages.
# Enable Pages for the repo with "Source: GitHub Actions" (Settings → Pages).

on:
  push:
    # Deploys when the app changes on the repo's default branch.
    # (Manual runs via workflow_dispatch work from any branch.)
    branches:
      - main
      - claude/construction-crowdsource-app-yA3uI
      - claude/vegan-restaurant-mapper-K7S3R
    paths:
      - "vegan-map/**"
      - ".github/workflows/deploy-vegan-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vegan-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vegan-map/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vegan-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
